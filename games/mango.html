<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mango &middot; Alisha Arcade</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --cell: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --sky: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    button, .back-link, canvas {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
    }

    .game {
      background: var(--panel);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      opacity: 0.85;
      transition: opacity 0.15s ease;
    }
    .back-link:hover { opacity: 1; }

    h1 {
      text-align: center;
      font-size: 1.9rem;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat {
      flex: 1;
      background: var(--cell);
      border-radius: 10px;
      padding: 7px 10px;
      text-align: center;
    }
    .stat .label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .stat .value { font-size: 1.15rem; font-weight: 700; }

    .board-wrap { position: relative; }

    canvas#board {
      background: linear-gradient(#0e1a33, var(--sky));
      border-radius: 12px;
      display: block;
      width: 100%;
      height: min(520px, 62vh);
      touch-action: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(11, 17, 32, 0.86);
      border-radius: 12px;
      text-align: center;
      padding: 24px;
    }
    .overlay.show { display: flex; }
    .overlay h2 { font-size: 1.5rem; }
    .overlay p { color: var(--muted); font-size: 0.95rem; line-height: 1.5; }

    button.action {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #1a1206;
      background: var(--accent);
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button.action:hover { opacity: 0.9; transform: translateY(-1px); }
    button.action:active { transform: translateY(0); }

    .touch-controls {
      display: none;
      gap: 12px;
      margin-top: 14px;
    }
    .touch-controls button {
      flex: 1;
      padding: 18px 0;
      border: none;
      border-radius: 12px;
      background: var(--cell);
      color: var(--text);
      font-size: 1.4rem;
      font-weight: 700;
      cursor: pointer;
    }
    .touch-controls button:active { background: var(--accent); color: #1a1206; }
    body.mode-touch .touch-controls { display: flex; }

    .ctrl-select {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-top: 14px;
    }
    .ctrl-select button {
      padding: 8px 16px;
      border: none;
      border-radius: 9px;
      background: var(--cell);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .ctrl-select button.active { background: var(--accent); color: #1a1206; }

    .controls-help {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.6;
      text-align: center;
    }
    .controls-help kbd {
      background: var(--cell);
      border-radius: 5px;
      padding: 1px 7px;
      font-family: inherit;
      font-size: 0.72rem;
      color: var(--text);
    }
    .controls-help.touch { display: none; }
    body.mode-touch .controls-help.keyboard { display: none; }
    body.mode-touch .controls-help.touch { display: block; }
  </style>
</head>
<body>
  <main class="game">
    <a class="back-link" href="../index.html">&larr; Back to Alisha Arcade</a>
    <h1>Mango 🥭</h1>

    <div class="hud">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Lives</div><div class="value" id="lives">❤️❤️❤️</div></div>
      <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="360" height="520"></canvas>
      <div class="overlay show" id="overlay">
        <h2 id="overlayTitle">Catch the Mangoes! 🥭</h2>
        <p id="overlayText">Move the basket to catch falling mangoes.<br>Miss three and it's game over.</p>
        <button class="action" id="overlayBtn">Start</button>
      </div>
    </div>

    <div class="touch-controls">
      <button data-dir="-1" aria-label="move left">&larr;</button>
      <button data-dir="1" aria-label="move right">&rarr;</button>
    </div>

    <div class="ctrl-select">
      <button data-ctrl="touch" id="ctrlTouch">📱 On-screen</button>
      <button data-ctrl="keyboard" id="ctrlKeyboard">⌨ Keyboard</button>
    </div>

    <div class="controls-help keyboard">
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &middot; or drag on the board
    </div>
    <div class="controls-help touch">
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> buttons &middot; or drag on the board
    </div>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayBtn = document.getElementById('overlayBtn');

    const BASKET_W = 74;
    const BASKET_H = 46;
    const BASKET_Y = H - BASKET_H - 6; // top of the basket rim

    let basketX, mangoes, score, lives, level;
    let leftHeld, rightHeld, targetX;
    let running, gameOver;
    let rafId, lastTime, spawnTimer, spawnInterval;

    function reset() {
      basketX = W / 2;
      targetX = null;
      mangoes = [];
      score = 0;
      lives = 3;
      level = 1;
      leftHeld = rightHeld = false;
      spawnInterval = 1100;
      spawnTimer = 0;
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '—';
      levelEl.textContent = level;
    }

    function spawnMango() {
      const size = 30 + Math.random() * 8;
      mangoes.push({
        x: size + Math.random() * (W - size * 2),
        y: -size,
        size,
        vy: 90 + (level - 1) * 26 + Math.random() * 30,
        spin: (Math.random() - 0.5) * 3
      });
    }

    function update(dt) {
      // Move basket
      const speed = 380; // px/s for key/button hold
      if (leftHeld) basketX -= speed * dt;
      if (rightHeld) basketX += speed * dt;
      if (targetX !== null) basketX += (targetX - basketX) * Math.min(1, dt * 16);
      basketX = Math.max(BASKET_W / 2, Math.min(W - BASKET_W / 2, basketX));

      // Spawn
      spawnTimer += dt * 1000;
      if (spawnTimer >= spawnInterval) {
        spawnTimer = 0;
        spawnMango();
      }

      // Move mangoes, handle catch / miss
      for (let i = mangoes.length - 1; i >= 0; i--) {
        const m = mangoes[i];
        m.y += m.vy * dt;
        const caught = m.y + m.size * 0.4 >= BASKET_Y &&
                       m.y - m.size * 0.4 <= BASKET_Y + BASKET_H &&
                       m.x >= basketX - BASKET_W / 2 &&
                       m.x <= basketX + BASKET_W / 2;
        if (caught) {
          mangoes.splice(i, 1);
          score++;
          const newLevel = Math.floor(score / 10) + 1;
          if (newLevel !== level) {
            level = newLevel;
            spawnInterval = Math.max(430, 1100 - (level - 1) * 120);
          }
          updateHud();
        } else if (m.y - m.size > H) {
          mangoes.splice(i, 1);
          lives--;
          updateHud();
          if (lives <= 0) { endGame(); return; }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      // Mangoes (emoji)
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      for (const m of mangoes) {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.font = `${m.size}px serif`;
        ctx.fillText('🥭', 0, 0);
        ctx.restore();
      }

      // Basket
      const bx = basketX;
      const by = BASKET_Y;
      ctx.fillStyle = '#a16207';
      ctx.strokeStyle = '#7c4a06';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx - BASKET_W / 2, by);
      ctx.lineTo(bx + BASKET_W / 2, by);
      ctx.lineTo(bx + BASKET_W / 2 - 8, by + BASKET_H);
      ctx.lineTo(bx - BASKET_W / 2 + 8, by + BASKET_H);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // rim
      ctx.fillStyle = '#ca8a04';
      ctx.fillRect(bx - BASKET_W / 2 - 2, by - 6, BASKET_W + 4, 8);
      // weave lines
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.lineWidth = 2;
      for (let k = 1; k < 4; k++) {
        ctx.beginPath();
        ctx.moveTo(bx - BASKET_W / 2 + 4, by + (BASKET_H * k) / 4);
        ctx.lineTo(bx + BASKET_W / 2 - 4, by + (BASKET_H * k) / 4);
        ctx.stroke();
      }
    }

    function loop(time) {
      if (!running) return;
      if (!lastTime) lastTime = time;
      const dt = Math.min(0.05, (time - lastTime) / 1000);
      lastTime = time;
      update(dt);
      if (!running) return; // endGame may have stopped us
      draw();
      rafId = requestAnimationFrame(loop);
    }

    function startGame() {
      reset();
      overlay.classList.remove('show');
      running = true;
      gameOver = false;
      lastTime = 0;
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function endGame() {
      running = false;
      gameOver = true;
      cancelAnimationFrame(rafId);
      draw();
      overlayTitle.textContent = 'Game Over';
      overlayText.innerHTML = `You caught <strong>${score}</strong> mango${score === 1 ? '' : 's'}!`;
      overlayBtn.textContent = 'Play Again';
      overlay.classList.add('show');
    }

    // --- Input ---
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { leftHeld = true; targetX = null; e.preventDefault(); }
      else if (e.key === 'ArrowRight') { rightHeld = true; targetX = null; e.preventDefault(); }
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') leftHeld = false;
      else if (e.key === 'ArrowRight') rightHeld = false;
    });

    // Drag / pointer on the board (mouse + touch)
    function pointerToCanvasX(clientX) {
      const rect = canvas.getBoundingClientRect();
      return ((clientX - rect.left) / rect.width) * W;
    }
    let dragging = false;
    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      targetX = pointerToCanvasX(e.clientX);
      canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', (e) => {
      if (dragging) targetX = pointerToCanvasX(e.clientX);
    });
    canvas.addEventListener('pointerup', () => { dragging = false; });
    canvas.addEventListener('pointercancel', () => { dragging = false; });

    // On-screen buttons
    document.querySelectorAll('.touch-controls button').forEach(btn => {
      const dir = Number(btn.dataset.dir);
      const press = (e) => { e.preventDefault(); targetX = null; if (dir < 0) leftHeld = true; else rightHeld = true; };
      const release = () => { if (dir < 0) leftHeld = false; else rightHeld = false; };
      btn.addEventListener('pointerdown', press);
      btn.addEventListener('pointerup', release);
      btn.addEventListener('pointerleave', release);
      btn.addEventListener('pointercancel', release);
    });

    overlayBtn.addEventListener('click', startGame);

    // --- Control scheme: On-screen vs Keyboard ---
    const ctrlTouchBtn = document.getElementById('ctrlTouch');
    const ctrlKeyboardBtn = document.getElementById('ctrlKeyboard');
    const CONTROLS_KEY = 'mango-control-scheme';
    function setControlScheme(scheme) {
      document.body.classList.toggle('mode-touch', scheme === 'touch');
      ctrlTouchBtn.classList.toggle('active', scheme === 'touch');
      ctrlKeyboardBtn.classList.toggle('active', scheme === 'keyboard');
      try { localStorage.setItem(CONTROLS_KEY, scheme); } catch (e) { /* ignore */ }
    }
    ctrlTouchBtn.addEventListener('click', () => setControlScheme('touch'));
    ctrlKeyboardBtn.addEventListener('click', () => setControlScheme('keyboard'));

    let savedScheme = null;
    try { savedScheme = localStorage.getItem(CONTROLS_KEY); } catch (e) { /* ignore */ }
    const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    setControlScheme(savedScheme || (isTouchDevice ? 'touch' : 'keyboard'));

    // Draw the initial idle frame behind the start overlay.
    reset();
    draw();
  </script>
</body>
</html>
