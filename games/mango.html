<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mango &middot; Alisha Arcade</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --cell: #334155;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #f59e0b;
      --sky: #0b1120;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    button, .back-link, canvas {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
    }

    .game {
      background: var(--panel);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 440px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 10px;
      opacity: 0.85;
      transition: opacity 0.15s ease;
    }
    .back-link:hover { opacity: 1; }

    h1 {
      text-align: center;
      font-size: 1.9rem;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f97316);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hud {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .stat {
      flex: 1;
      background: var(--cell);
      border-radius: 10px;
      padding: 7px 10px;
      text-align: center;
    }
    .stat .label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 2px;
    }
    .stat .value { font-size: 1.15rem; font-weight: 700; }

    .board-wrap { position: relative; }

    canvas#board {
      background: linear-gradient(#0e1a33, var(--sky));
      border-radius: 12px;
      display: block;
      width: 100%;
      height: min(540px, 64vh);
      touch-action: none;
      cursor: crosshair;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(11, 17, 32, 0.86);
      border-radius: 12px;
      text-align: center;
      padding: 24px;
    }
    .overlay.show { display: flex; }
    .overlay h2 { font-size: 1.5rem; }
    .overlay p { color: var(--muted); font-size: 0.92rem; line-height: 1.55; }

    button.action {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      color: #1a1206;
      background: var(--accent);
      transition: opacity 0.15s ease, transform 0.1s ease;
    }
    button.action:hover { opacity: 0.9; transform: translateY(-1px); }
    button.action:active { transform: translateY(0); }

    .legend {
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.7;
      text-align: center;
    }
    .legend b { color: var(--text); }
  </style>
</head>
<body>
  <main class="game">
    <a class="back-link" href="../index.html">&larr; Back to Alisha Arcade</a>
    <h1>Mango 🍍</h1>

    <div class="hud">
      <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">Hearts</div><div class="value" id="hearts">❤️ 10</div></div>
      <div class="stat"><div class="label">Level</div><div class="value" id="level">1</div></div>
    </div>

    <div class="board-wrap">
      <canvas id="board" width="360" height="540"></canvas>
      <div class="overlay show" id="overlay">
        <h2 id="overlayTitle">Blast the Pineapples! 🍍</h2>
        <p id="overlayText">
          Tap or click falling pineapples to shoot them.<br>
          Miss one and you lose half a heart.<br>
          <b>🍍 Regular</b> = 100 &middot; <b style="color:#fbbf24">✦ Golden</b> = 1000 &middot;
          <b style="color:#4ade80">🥭 Mango</b> heals a heart.
        </p>
        <button class="action" id="overlayBtn">Start</button>
      </div>
    </div>

    <div class="legend">
      <b>🍍 Regular</b> 100 &middot;
      <b style="color:#fbbf24">✦ Golden</b> 1000 &middot;
      <b style="color:#4ade80">🥭 Mango</b> +1 heart &middot;
      miss = &minus;&frac12; heart
    </div>
  </main>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;

    const scoreEl = document.getElementById('score');
    const heartsEl = document.getElementById('hearts');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayText = document.getElementById('overlayText');
    const overlayBtn = document.getElementById('overlayBtn');

    const MAX_HEARTS = 10;
    const GUN_X = W / 2;
    const GUN_Y = H; // turret base sits at the bottom-center

    // Pineapple types and their spawn weights.
    const TYPES = {
      regular: { weight: 78, points: 100, emoji: '🍍', halo: null, badge: null, speed: 1 },
      golden:  { weight: 12, points: 1000, emoji: '🍍', halo: '#fbbf24', badge: '✦', speed: 1.35 },
      mango:   { weight: 10, points: 0, heal: 1, emoji: '🥭', halo: '#4ade80', badge: null, speed: 1 }
    };
    const WEIGHT_TOTAL = Object.values(TYPES).reduce((s, t) => s + t.weight, 0);

    let pineapples, lasers, particles;
    let score, hearts, level, spawnedCount;
    let aimAngle, running, gameOver;
    let rafId, lastTime, spawnTimer, spawnInterval;

    function reset() {
      pineapples = [];
      lasers = [];
      particles = [];
      score = 0;
      hearts = MAX_HEARTS;
      level = 1;
      spawnedCount = 0;
      aimAngle = -Math.PI / 2; // pointing straight up
      spawnInterval = 1200;
      spawnTimer = 0;
      updateHud();
    }

    function updateHud() {
      scoreEl.textContent = score;
      const h = Number.isInteger(hearts) ? hearts : hearts.toFixed(1);
      heartsEl.textContent = '❤️ ' + h;
      levelEl.textContent = level;
    }

    function pickType() {
      let r = Math.random() * WEIGHT_TOTAL;
      for (const [name, t] of Object.entries(TYPES)) {
        if ((r -= t.weight) < 0) return name;
      }
      return 'regular';
    }

    function spawnPineapple() {
      const type = pickType();
      const cfg = TYPES[type];
      const size = 34;
      spawnedCount++;
      level = 1 + Math.floor(spawnedCount / 12);
      spawnInterval = Math.max(520, 1200 - (level - 1) * 100);
      pineapples.push({
        x: size + Math.random() * (W - size * 2),
        y: -size,
        size,
        type,
        vy: (70 + (level - 1) * 20 + Math.random() * 25) * cfg.speed,
        rot: (Math.random() - 0.5) * 0.5,
        spin: (Math.random() - 0.5) * 1.5
      });
    }

    function burst(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 60 + Math.random() * 160;
        particles.push({
          x, y,
          vx: Math.cos(a) * sp,
          vy: Math.sin(a) * sp,
          life: 0.5 + Math.random() * 0.3,
          color
        });
      }
    }

    function shootAt(px, py) {
      if (!running) return;
      aimAngle = Math.atan2(py - GUN_Y, px - GUN_X);
      // Find the front-most pineapple under the point.
      let hitIndex = -1;
      for (let i = pineapples.length - 1; i >= 0; i--) {
        const m = pineapples[i];
        if (Math.hypot(m.x - px, m.y - py) <= m.size * 0.62) { hitIndex = i; break; }
      }

      if (hitIndex >= 0) {
        const m = pineapples[hitIndex];
        const cfg = TYPES[m.type];
        lasers.push({ tx: m.x, ty: m.y, life: 0.12 });
        if (cfg.heal) {
          hearts = Math.min(MAX_HEARTS, hearts + cfg.heal);
          burst(m.x, m.y, '#4ade80');
        } else {
          score += cfg.points;
          burst(m.x, m.y, m.type === 'golden' ? '#fbbf24' : '#fde047');
        }
        pineapples.splice(hitIndex, 1);
        updateHud();
      } else {
        // Missed shot — just a laser flash to the tapped point.
        lasers.push({ tx: px, ty: py, life: 0.1 });
      }
    }

    function loseHeart() {
      hearts -= 0.5;
      updateHud();
      if (hearts <= 0) { hearts = 0; endGame(); }
    }

    function update(dt) {
      spawnTimer += dt * 1000;
      if (spawnTimer >= spawnInterval) { spawnTimer = 0; spawnPineapple(); }

      for (let i = pineapples.length - 1; i >= 0; i--) {
        const m = pineapples[i];
        m.y += m.vy * dt;
        m.rot += m.spin * dt;
        if (m.y - m.size > H) {
          pineapples.splice(i, 1);
          loseHeart();
          if (!running) return;
        }
      }

      for (let i = lasers.length - 1; i >= 0; i--) {
        lasers[i].life -= dt;
        if (lasers[i].life <= 0) lasers.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 300 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawPineapple(m) {
      const cfg = TYPES[m.type];
      ctx.save();
      ctx.translate(m.x, m.y);
      if (cfg.halo) {
        ctx.shadowColor = cfg.halo;
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.arc(0, 0, m.size * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = cfg.halo + '55';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
      ctx.rotate(m.rot);
      ctx.font = m.size + 'px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(cfg.emoji, 0, 0);
      ctx.restore();

      if (cfg.badge) {
        ctx.save();
        ctx.font = 'bold 18px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = cfg.halo;
        ctx.fillText(cfg.badge, m.x + m.size * 0.42, m.y - m.size * 0.42);
        ctx.restore();
      }
    }

    function drawGun() {
      const len = 34;
      const tipX = GUN_X + Math.cos(aimAngle) * len;
      const tipY = GUN_Y + Math.sin(aimAngle) * len;
      // barrel
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(GUN_X, GUN_Y);
      ctx.lineTo(tipX, tipY);
      ctx.stroke();
      // base
      ctx.fillStyle = '#f59e0b';
      ctx.beginPath();
      ctx.arc(GUN_X, GUN_Y, 22, Math.PI, 0);
      ctx.fill();
      ctx.strokeStyle = '#b45309';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      pineapples.forEach(drawPineapple);

      // laser beams
      for (const l of lasers) {
        const tipX = GUN_X + Math.cos(aimAngle) * 34;
        const tipY = GUN_Y + Math.sin(aimAngle) * 34;
        ctx.save();
        ctx.globalAlpha = Math.max(0, l.life / 0.12);
        ctx.strokeStyle = '#f87171';
        ctx.shadowColor = '#ef4444';
        ctx.shadowBlur = 12;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(tipX, tipY);
        ctx.lineTo(l.tx, l.ty);
        ctx.stroke();
        ctx.restore();
      }

      // particles
      for (const p of particles) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      drawGun();
    }

    function loop(time) {
      if (!running) return;
      if (!lastTime) lastTime = time;
      const dt = Math.min(0.05, (time - lastTime) / 1000);
      lastTime = time;
      update(dt);
      if (!running) return; // endGame may have stopped the loop
      draw();
      rafId = requestAnimationFrame(loop);
    }

    function startGame() {
      reset();
      overlay.classList.remove('show');
      running = true;
      gameOver = false;
      lastTime = 0;
      cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(loop);
    }

    function endGame() {
      running = false;
      gameOver = true;
      cancelAnimationFrame(rafId);
      draw();
      overlayTitle.textContent = 'Game Over';
      overlayText.innerHTML = `Final score: <strong>${score}</strong>`;
      overlayBtn.textContent = 'Play Again';
      overlay.classList.add('show');
    }

    function pointerToCanvas(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: ((e.clientX - rect.left) / rect.width) * W,
        y: ((e.clientY - rect.top) / rect.height) * H
      };
    }

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const p = pointerToCanvas(e);
      shootAt(p.x, p.y);
    });

    overlayBtn.addEventListener('click', startGame);

    // Draw an idle frame behind the start overlay.
    reset();
    draw();
  </script>
</body>
</html>
