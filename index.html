<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alisha Arcade</title>
  <meta name="description" content="Alisha Arcade — a collection of fun browser games: Tic Tac Toe, Tetris, Connect 4, Pac-Man, Mango and Racing.">

  <!-- Installable web app (iPhone home screen + Android PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alisha Arcade">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/app-icon-192.png">
  <script src="arcade.js"></script>

  <!-- Link previews -->
  <meta property="og:title" content="Alisha Arcade">
  <meta property="og:description" content="Play Tic Tac Toe, Tetris, Connect 4, Pac-Man, Mango and Racing.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/app-banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #334155;
      --card-hover: #3f4d63;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #a78bfa;
      --x-color: #38bdf8;
      --o-color: #fb7185;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 20px 20px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    .poster {
      display: block;
      width: 100%;
      max-width: 680px;
      aspect-ratio: 16 / 9;      /* rectangular banner shape */
      object-fit: cover;
      object-position: center;
      margin: 0 auto;
      border-radius: 16px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.45);
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--x-color), var(--accent), var(--o-color));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      margin-top: 12px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      background: var(--card-hover);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      display: block;
    }

    /* Fallback placeholder shown until the real image is added */
    .thumb .placeholder {
      font-size: 3.5rem;
      line-height: 1;
      opacity: 0.9;
    }

    .game-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    footer {
      text-align: center;
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.8rem;
      opacity: 0.7;
    }
    footer .version { display: block; margin-top: 6px; font-size: 0.72rem; opacity: 0.8; }

    /* Top bar: Shop menu (left) and the arcade coin total (right) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto 28px;
    }
    .shop-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #1a1206;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 9px 16px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .shop-link:hover { transform: translateY(-1px); opacity: 0.95; }
    .coins {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border-radius: 12px;
      padding: 9px 16px;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .coins .amount { color: #fbbf24; }
    .coins .label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
    }

    .right-group { display: inline-flex; align-items: center; gap: 10px; }
    .icon-btn {
      background: var(--card);
      border: none;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 1.15rem;
      line-height: 1;
      cursor: pointer;
      color: var(--text);
      transition: transform 0.12s ease, background 0.15s ease;
    }
    .icon-btn:hover { transform: translateY(-1px); background: var(--card-hover); }

    /* Settings modal */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.62);
      z-index: 100;
      padding: 20px;
    }
    .modal.show { display: flex; }
    .modal-card {
      background: var(--panel);
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    .modal-card h2 { font-size: 1.25rem; margin-bottom: 6px; }
    .modal-card .hint { color: var(--muted); font-size: 0.85rem; margin-bottom: 14px; }
    .modal-card input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--card);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    .modal-card input:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
    .modal-actions button {
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-primary { color: #1a1206; background: linear-gradient(90deg, #a78bfa, #7c5cff); }
    .btn-ghost { color: var(--muted); background: transparent; }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="shop-link" href="shop.html">🛒 Shop</a>
    <div class="right-group">
      <div class="coins">🪙 <span class="label">Coins</span> <span class="amount" id="coinTotal">0</span></div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙️</button>
    </div>
  </div>

  <header>
    <img class="poster" src="images/poster.png"
         alt="Alisha Arcade — Many games. One place."
         onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
    <h1 style="display:none;">Alisha Arcade</h1>
    <p class="tagline" id="tagline">Pick a game and play!</p>
  </header>

  <div class="modal" id="settingsModal">
    <div class="modal-card">
      <h2>Your name</h2>
      <p class="hint">Used in games in place of "You" / "Player 1".</p>
      <input id="nameInput" type="text" maxlength="20" placeholder="Enter your name" autocomplete="off">
      <div class="modal-actions">
        <button class="btn-ghost" id="nameCancel">Cancel</button>
        <button class="btn-primary" id="nameSave">Save</button>
      </div>
    </div>
  </div>

  <main class="games-grid">
    <a class="game-card" href="games/tic-tac-toe.html">
      <div class="thumb">
        <img src="images/tic-tac-toe.png" alt="Tic Tac Toe"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">⭕❌</span>
      </div>
      <span class="game-name">Tic Tac Toe</span>
    </a>

    <a class="game-card" href="games/tetris.html">
      <div class="thumb">
        <img src="images/tetris.png" alt="Tetris"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🟦🟨</span>
      </div>
      <span class="game-name">Tetris</span>
    </a>

    <a class="game-card" href="games/connect-4.html">
      <div class="thumb">
        <img src="images/connect-4.png" alt="Connect 4"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🔴🟡</span>
      </div>
      <span class="game-name">Connect 4</span>
    </a>

    <a class="game-card" href="games/mango.html">
      <div class="thumb">
        <img src="images/mango.png" alt="Mango"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🥭</span>
      </div>
      <span class="game-name">Mango</span>
    </a>

    <a class="game-card" href="games/pac-man.html">
      <div class="thumb">
        <img src="images/pac-man.png" alt="Pac-Man"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🟡👻</span>
      </div>
      <span class="game-name">Pac-Man</span>
    </a>

    <a class="game-card" href="games/racing.html">
      <div class="thumb">
        <img src="images/racing.png" alt="Racing"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🏎️</span>
      </div>
      <span class="game-name">Racing</span>
    </a>

    <!-- Add more games here as they are built:
    <a class="game-card" href="games/your-game.html">
      <div class="thumb">
        <img src="images/your-game.png" alt="Your Game"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🎮</span>
      </div>
      <span class="game-name">Your Game</span>
    </a>
    -->
  </main>

  <footer>
    More games coming soon 🎮
    <span class="version" id="appVersion"></span>
  </footer>

  <script>
    // Show the arcade coin total (earned across all games) and keep it fresh
    // when returning from a game.
    (function () {
      const coinEl = document.getElementById('coinTotal');
      const tagline = document.getElementById('tagline');
      function renderCoins() { coinEl.textContent = Arcade.getCoins().toLocaleString(); }
      function renderGreeting() {
        const n = Arcade.getName();
        tagline.textContent = n ? ('Hi ' + n + '! Pick a game and play!') : 'Pick a game and play!';
      }
      renderCoins();
      renderGreeting();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') renderCoins(); });
      window.addEventListener('pageshow', renderCoins);

      // Settings: player name
      const settingsBtn = document.getElementById('settingsBtn');
      const modal = document.getElementById('settingsModal');
      const input = document.getElementById('nameInput');
      const saveBtn = document.getElementById('nameSave');
      const cancelBtn = document.getElementById('nameCancel');
      function openSettings() { input.value = Arcade.getName(); modal.classList.add('show'); setTimeout(() => input.focus(), 50); }
      function closeSettings() { modal.classList.remove('show'); }
      function save() { Arcade.setName(input.value); renderGreeting(); closeSettings(); }
      settingsBtn.addEventListener('click', openSettings);
      cancelBtn.addEventListener('click', closeSettings);
      saveBtn.addEventListener('click', save);
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter') save(); });
      modal.addEventListener('click', (e) => { if (e.target === modal) closeSettings(); });

      // App version in the footer — read from the active service-worker cache
      // bucket (named "alisha-arcade-vN"), so it always matches CACHE_VERSION.
      const vEl = document.getElementById('appVersion');
      if (vEl && 'caches' in window) {
        caches.keys().then((keys) => {
          const vers = keys
            .filter((k) => k.indexOf('alisha-arcade-') === 0)
            .map((k) => k.replace('alisha-arcade-', ''));
          if (!vers.length) return;
          vers.sort((a, b) => (parseInt(b.slice(1), 10) || 0) - (parseInt(a.slice(1), 10) || 0));
          vEl.textContent = 'Version ' + vers[0];
        }).catch(() => {});
      }
    })();
  </script>

  <script src="sw-register.js"></script>
</body>
</html>
