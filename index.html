<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alisha Arcade</title>
  <meta name="description" content="Alisha Arcade — a collection of fun browser games: Tic Tac Toe, Tetris, Connect 4, Pac-Man, Mango and Racing.">

  <!-- Installable web app (iPhone home screen + Android PWA) -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Alisha Arcade">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="images/app-icon-192.png">

  <!-- Link previews -->
  <meta property="og:title" content="Alisha Arcade">
  <meta property="og:description" content="Play Tic Tac Toe, Tetris, Connect 4, Pac-Man, Mango and Racing.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="images/app-banner.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --card: #334155;
      --card-hover: #3f4d63;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #a78bfa;
      --x-color: #38bdf8;
      --o-color: #fb7185;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 20px 20px 64px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -1px;
      background: linear-gradient(90deg, var(--x-color), var(--accent), var(--o-color));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .tagline {
      margin-top: 10px;
      color: var(--muted);
      font-size: 1.05rem;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      background: var(--card);
      border-radius: 18px;
      padding: 18px;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .game-card:hover {
      transform: translateY(-6px);
      background: var(--card-hover);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .thumb {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      background: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 10px;
      display: block;
    }

    /* Fallback placeholder shown until the real image is added */
    .thumb .placeholder {
      font-size: 3.5rem;
      line-height: 1;
      opacity: 0.9;
    }

    .game-name {
      font-size: 1.15rem;
      font-weight: 700;
    }

    footer {
      text-align: center;
      margin-top: 56px;
      color: var(--muted);
      font-size: 0.8rem;
      opacity: 0.7;
    }

    /* Top bar: Shop menu (left) and the arcade coin total (right) */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      max-width: 900px;
      margin: 0 auto 28px;
    }
    .shop-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: #1a1206;
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      font-weight: 700;
      font-size: 0.95rem;
      padding: 9px 16px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .shop-link:hover { transform: translateY(-1px); opacity: 0.95; }
    .coins {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border-radius: 12px;
      padding: 9px 16px;
      font-weight: 800;
      font-size: 1.05rem;
    }
    .coins .amount { color: #fbbf24; }
    .coins .label {
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <a class="shop-link" href="shop.html">🛒 Shop</a>
    <div class="coins">🪙 <span class="label">Coins</span> <span class="amount" id="coinTotal">0</span></div>
  </div>

  <header>
    <h1>Alisha Arcade</h1>
    <p class="tagline">Pick a game and play!</p>
  </header>

  <main class="games-grid">
    <a class="game-card" href="games/tic-tac-toe.html">
      <div class="thumb">
        <img src="images/tic-tac-toe.png" alt="Tic Tac Toe"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">⭕❌</span>
      </div>
      <span class="game-name">Tic Tac Toe</span>
    </a>

    <a class="game-card" href="games/tetris.html">
      <div class="thumb">
        <img src="images/tetris.png" alt="Tetris"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🟦🟨</span>
      </div>
      <span class="game-name">Tetris</span>
    </a>

    <a class="game-card" href="games/connect-4.html">
      <div class="thumb">
        <img src="images/connect-4.png" alt="Connect 4"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🔴🟡</span>
      </div>
      <span class="game-name">Connect 4</span>
    </a>

    <a class="game-card" href="games/mango.html">
      <div class="thumb">
        <img src="images/mango.png" alt="Mango"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🥭</span>
      </div>
      <span class="game-name">Mango</span>
    </a>

    <a class="game-card" href="games/pac-man.html">
      <div class="thumb">
        <img src="images/pac-man.png" alt="Pac-Man"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🟡👻</span>
      </div>
      <span class="game-name">Pac-Man</span>
    </a>

    <a class="game-card" href="games/racing.html">
      <div class="thumb">
        <img src="images/racing.png" alt="Racing"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🏎️</span>
      </div>
      <span class="game-name">Racing</span>
    </a>

    <!-- Add more games here as they are built:
    <a class="game-card" href="games/your-game.html">
      <div class="thumb">
        <img src="images/your-game.png" alt="Your Game"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <span class="placeholder" style="display:none;">🎮</span>
      </div>
      <span class="game-name">Your Game</span>
    </a>
    -->
  </main>

  <footer>More games coming soon 🎮</footer>

  <script>
    // Show the arcade coin total (earned across all games) and keep it fresh
    // when returning from a game.
    (function () {
      const el = document.getElementById('coinTotal');
      function render() {
        let v = 0;
        try { v = Number(localStorage.getItem('arcade-coins')) || 0; } catch (e) { /* ignore */ }
        el.textContent = v.toLocaleString();
      }
      render();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') render(); });
      window.addEventListener('pageshow', render);
    })();
  </script>

  <script>
    // Register the offline service worker (silent update on next launch).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').then((reg) => {
          reg.update();
          document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') reg.update();
          });
        }).catch(() => {});
      });
    }
  </script>
</body>
</html>
